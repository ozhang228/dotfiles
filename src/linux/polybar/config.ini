[colors]
bg = #ffffff
bg_alt = #e7ecf0
fg = #010409
fg_subtle = #66707b
accent = #0349b4
accent_bright = #4a98fa
red = #a0111f
red_bright = #d1242f
orange = #702c00
yellow = #744500
green = #055d20
cyan = #1b7c83
purple = #512598
transparent = #00000000

[bar/main]
monitor = ${env:MONITOR:}
height = 45px
width = 100%
radius = 10
border-size = 5px

background = ${colors.bg_alt}
foreground = ${colors.fg}

font-0 = JetBrainsMono Nerd Font:size=14;3

enable-ipc = true

modules-left = launcher i3 wifi bluetooth
modules-center = date
modules-right = cpu audio mic battery

[module/launcher]
type = custom/text
content = "  "

content-background = ${colors.bg_alt}
content-foreground = ${colors.orange}
content-padding = 2px

click-left = rofi -show drun
click-middle = rofi -show drun
click-right = rofi -show drun

[module/i3]
type = internal/i3
content-foreground = ${colors.purple}
index-sort = true
pin-workspaces = true

ws-icon-0 = "1;  "
ws-icon-1 = "2;  "
ws-icon-2 = "3;  "


format = <label-state> <label-mode>

label-focused-foreground = ${colors.accent}

[module/wifi]
type = custom/text
content = "   "

content-foreground = ${colors.green}

click-left = gnome-control-center wifi
click-middle = gnome-control-center wifi
click-right = gnome-control-center wifi

[module/bluetooth]
type = custom/text
content = "  󰥉"

content-foreground = ${colors.accent}

click-left = blueman-manager
click-middle = blueman-manager
click-right = blueman-manager

[module/date]
type = internal/date

date = "󰃭 %a %m/%d - %H:%M:%S"

[module/cpu]
type = internal/cpu
content-padding = 5

format = " <label> "

[module/audio]
type = internal/pulseaudio

format-volume = "<ramp-volume> <label-volume> "

label-muted = "󰸈 0% "

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 


click-middle = pavucontrol
click-right = pavucontrol


[module/mic]
type = custom/script
exec = pactl get-source-volume @DEFAULT_SOURCE@ | grep -oE '[0-9]+%' | head -1
exec-if = pactl get-source-volume @DEFAULT_SOURCE@
tail = false
interval = 1

format = "󰍬 <label> "
label = %output%

click-left = pactl set-source-mute @DEFAULT_SOURCE@ toggle
click-middle = pavucontrol
click-right = pavucontrol


[module/battery]
type = internal/battery

full-at = 99
low-at = 20

format-charging = "󰂄 <label-charging>  "
format-discharging = "<ramp-capacity> <label-discharging>  "
format-full = "󰁹 100%  "

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-5 = 
