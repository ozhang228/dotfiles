# fix for screen tearing
backend = "glx";
vsync = true

glx-copy-from-front = true;
glx-swap-method = 2;
xrender-sync = true;
xrender-sync-fence = true;


corner-radius = 12;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'i3lock'"
];

fading = true;
fade-in-step = 0.1;
fade-out-step = 0.1;
fade-exclude = [ "class_g = 'i3lock'" ];

inactive-opacity = 0.96;
opacity-rule = [ "100:class_g = 'i3lock'" ];
focus-exclude = [ "class_g = 'i3lock'" ];

shadow = true;
shadow-radius = 12;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.6;
shadow-exclude = [ "class_g = 'i3lock'" ];

blur-method = "dual_kawase";
blur-strength = 5;
blur-background-exclude = [ "class_g = 'i3lock'" ];

