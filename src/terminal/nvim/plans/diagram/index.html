<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plan diagram</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #24273a;
      --surface: #363a4f;
      --surface-2: #494d64;
      --line: #5b6078;
      --ink: #cad3f5;
      --muted: #b8c0e0;
      --accent: #8aadf4;
      --pending: var(--accent);
      --progress: #eed49f;
      --done: #a6da95;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font:
        15px system-ui,
        sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 18px;
      padding: 14px 24px;
      background: var(--bg);
      border-bottom: 1px solid var(--surface-2);
      z-index: 1;
    }
    header strong {
      margin-right: auto;
      color: var(--accent);
    }
    .legend {
      display: flex;
      gap: 12px;
      font-size: 13px;
    }
    .legend span {
      padding: 4px 8px;
      border: 1.5px solid;
      border-radius: 6px;
    }
    .legend .pending {
      color: var(--pending);
    }
    .legend .progress {
      color: var(--progress);
    }
    .legend .done {
      color: var(--done);
    }
    button {
      background: var(--surface);
      color: inherit;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 5px 10px;
      cursor: pointer;
    }
    button:hover {
      border-color: var(--accent);
    }
    #status {
      font-size: 12px;
      color: var(--muted);
      padding: 8px 24px;
    }
    #viewport {
      overflow: auto;
      height: calc(100vh - 100px);
      padding: 20px;
    }
    #diagram {
      display: flex;
      flex-wrap: wrap;
      justify-content: safe center;
      align-items: flex-start;
      gap: 32px;
    }
    #diagram svg {
      display: block;
      max-width: none;
    }
    #diagram section {
      flex: none;
    }
  </style>
  <header>
    <strong>Plan</strong>
    <div class="legend">
      <span class="pending">Pending</span><span class="progress">In progress</span
      ><span class="done">Done</span>
    </div>
    <button id="out" aria-label="Zoom out">−</button><button id="fit">Fit</button
    ><button id="in" aria-label="Zoom in">+</button>
  </header>
  <div id="status">Loading…</div>
  <main id="viewport"><div id="diagram"></div></main>
  <script type="module">
    import { renderTaskTree } from "/render.mjs";

    const diagram = document.getElementById("diagram");
    const status = document.getElementById("status");
    const viewport = document.getElementById("viewport");
    let lastSource;
    let updatedAt;
    let scale = 1;
    let trees = [];
    const context = document.createElement("canvas").getContext("2d");
    if (!context) throw new Error("Text measurement is unavailable");
    context.font = "500 16px system-ui, sans-serif";

    function measureText(text) {
      return context.measureText(text).width;
    }

    function renderTree(root) {
      const { svg, width, height } = renderTaskTree(root, measureText);
      const parsed = new DOMParser().parseFromString(svg, "image/svg+xml");
      if (parsed.querySelector("parsererror")) throw new Error("Unable to render task tree");
      const section = document.createElement("section");
      const element = document.importNode(parsed.documentElement, true);
      section.append(element);
      return { section, svg: element, width, height };
    }

    function resizeDiagram() {
      for (const { section, svg, width, height } of trees) {
        section.style.width = `${width * scale}px`;
        svg.style.width = `${width * scale}px`;
        svg.style.height = `${height * scale}px`;
      }
    }
    function fitDiagram() {
      if (trees.length === 0) return;
      const widest = Math.max(...trees.map((tree) => tree.width));
      scale = Math.max(0.8, Math.min(1, (viewport.clientWidth - 40) / widest));
      resizeDiagram();
    }
    function zoomIn() {
      scale = Math.min(3, scale * 1.25);
      resizeDiagram();
    }
    function zoomOut() {
      scale = Math.max(0.1, scale / 1.25);
      resizeDiagram();
    }
    document.getElementById("in").addEventListener("click", zoomIn);
    document.getElementById("out").addEventListener("click", zoomOut);
    document.getElementById("fit").addEventListener("click", fitDiagram);

    async function refresh() {
      try {
        const response = await fetch("/diagram", { cache: "no-store" });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);
        const key = JSON.stringify(result.roots);
        if (key !== lastSource) {
          const first = lastSource === undefined;
          const rendered = result.roots.map(renderTree);
          diagram.replaceChildren(...rendered.map((tree) => tree.section));
          trees = rendered;
          lastSource = key;
          updatedAt = Date.now();
          if (first) fitDiagram();
          else resizeDiagram();
        }
        status.textContent = trees.length
          ? `Updated ${Math.floor((Date.now() - updatedAt) / 1000)}s ago`
          : "No checklist tasks";
      } catch (error) {
        status.textContent = `Unable to refresh: ${error.message}`;
      }
      setTimeout(refresh, 1000);
    }
    refresh();
  </script>
</html>
