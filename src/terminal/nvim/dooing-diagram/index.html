<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dooing · Todo diagram</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #24273a;
      color: #cad3f5;
      font:
        15px system-ui,
        sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 14px 24px;
      background: #24273a;
      border-bottom: 1px solid #494d64;
      z-index: 1;
    }
    header strong {
      margin-right: auto;
    }
    .legend {
      display: flex;
      gap: 12px;
      font-size: 13px;
    }
    .legend span {
      padding: 4px 8px;
      border-radius: 5px;
    }
    .pending {
      background: #363a4f;
    }
    .progress {
      background: #504d50;
    }
    .done {
      background: #3e4b4c;
    }
    button {
      background: #363a4f;
      color: inherit;
      border: 1px solid #5b6078;
      border-radius: 5px;
      padding: 5px 10px;
      cursor: pointer;
    }
    #status {
      font-size: 12px;
      color: #939ab7;
      padding: 8px 24px;
    }
    #viewport {
      overflow: auto;
      height: calc(100vh - 100px);
      padding: 20px;
    }
    #diagram {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 32px;
    }
    #diagram svg {
      max-width: none !important;
    }
  </style>
  <header>
    <strong>Todos</strong>
    <div class="legend">
      <span class="pending">Pending</span><span class="progress">In progress</span
      ><span class="done">Done</span>
    </div>
    <button id="out" aria-label="Zoom out">−</button><button id="fit">Fit</button
    ><button id="in" aria-label="Zoom in">+</button>
  </header>
  <div id="status">Loading…</div>
  <main id="viewport"><div id="diagram"></div></main>
  <script src="/mermaid.js"></script>
  <script>
    const diagram = document.getElementById("diagram");
    const status = document.getElementById("status");
    const viewport = document.getElementById("viewport");
    let lastSource;
    let scale = 1;
    let sequence = 0;
    let trees = [];
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: "strict",
      theme: "base",
      themeVariables: {
        background: "#24273a",
        primaryColor: "#363a4f",
        primaryTextColor: "#cad3f5",
        primaryBorderColor: "#939ab7",
        lineColor: "#939ab7",
        fontFamily: "system-ui, sans-serif",
      },
      flowchart: { htmlLabels: false, wrappingWidth: 1000, curve: "basis", useMaxWidth: false },
    });

    function resizeDiagram() {
      for (const { svg, width, height } of trees) {
        svg.style.width = `${width * scale}px`;
        svg.style.height = `${height * scale}px`;
      }
    }
    function fitDiagram() {
      if (trees.length === 0) return;
      const widest = Math.max(...trees.map((tree) => tree.width));
      scale = Math.min(1, (viewport.clientWidth - 40) / widest);
      resizeDiagram();
    }
    function zoomIn() {
      scale = Math.min(3, scale * 1.25);
      resizeDiagram();
    }
    function zoomOut() {
      scale = Math.max(0.1, scale / 1.25);
      resizeDiagram();
    }
    document.getElementById("in").addEventListener("click", zoomIn);
    document.getElementById("out").addEventListener("click", zoomOut);
    document.getElementById("fit").addEventListener("click", fitDiagram);

    async function refresh() {
      try {
        const response = await fetch("/diagram", { cache: "no-store" });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);
        const key = JSON.stringify(result.sources);
        if (key !== lastSource) {
          const first = lastSource === undefined;
          const rendered = [];
          for (const source of result.sources) {
            rendered.push(await mermaid.render(`todos-${sequence++}`, source));
          }
          diagram.replaceChildren();
          trees = rendered.map(({ svg }) => {
            const holder = document.createElement("div");
            holder.innerHTML = svg;
            diagram.append(holder);
            const element = holder.querySelector("svg");
            const box = element.viewBox.baseVal;
            return { svg: element, width: box.width, height: box.height };
          });
          lastSource = key;
          if (first) fitDiagram();
          else resizeDiagram();
        }
        status.textContent = "Live · updates automatically";
      } catch (error) {
        status.textContent = `Unable to refresh: ${error.message}`;
      }
      setTimeout(refresh, 1000);
    }
    refresh();
  </script>
</html>
