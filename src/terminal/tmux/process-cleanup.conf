# Keep detached children associated with their session, even after a pane exits.
set-hook -g session-created[90] 'run-shell "python3 ~/dotfiles/src/terminal/tmux/process-cleanup.py sync #{q:socket_path} #{pid}"'
set-hook -g after-new-window[90] 'run-shell "python3 ~/dotfiles/src/terminal/tmux/process-cleanup.py sync #{q:socket_path} #{pid}"'
set-hook -g after-split-window[90] 'run-shell "python3 ~/dotfiles/src/terminal/tmux/process-cleanup.py sync #{q:socket_path} #{pid}"'
set-hook -g after-move-pane[90] 'run-shell "python3 ~/dotfiles/src/terminal/tmux/process-cleanup.py sync #{q:socket_path} #{pid}"'
set-hook -g after-join-pane[90] 'run-shell "python3 ~/dotfiles/src/terminal/tmux/process-cleanup.py sync #{q:socket_path} #{pid}"'
set-hook -g window-linked[90] 'run-shell "python3 ~/dotfiles/src/terminal/tmux/process-cleanup.py sync #{q:socket_path} #{pid}"'
set-hook -g window-unlinked[90] 'run-shell "python3 ~/dotfiles/src/terminal/tmux/process-cleanup.py sync #{q:socket_path} #{pid}"'
set-hook -g session-closed[90] 'run-shell "python3 ~/dotfiles/src/terminal/tmux/process-cleanup.py sync #{q:socket_path} #{pid}"'
run-shell 'python3 ~/dotfiles/src/terminal/tmux/process-cleanup.py sync #{q:socket_path} #{pid}'
