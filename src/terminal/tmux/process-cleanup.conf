# Keep detached children associated with their session, even after a pane exits.
%hidden PROCESS_CLEANUP_SYNC="python3 ~/dotfiles/src/terminal/tmux/process-cleanup.py sync #{q:socket_path} #{pid}"
set-hook -g session-created[90] "run-shell '$PROCESS_CLEANUP_SYNC'"
set-hook -g after-new-window[90] "run-shell '$PROCESS_CLEANUP_SYNC'"
set-hook -g after-split-window[90] "run-shell '$PROCESS_CLEANUP_SYNC'"
set-hook -g window-layout-changed[90] "run-shell -b '$PROCESS_CLEANUP_SYNC'"
set-hook -g window-linked[90] "run-shell '$PROCESS_CLEANUP_SYNC'"
set-hook -g window-unlinked[90] "run-shell '$PROCESS_CLEANUP_SYNC'"
set-hook -g session-closed[90] "run-shell '$PROCESS_CLEANUP_SYNC'"
run-shell "$PROCESS_CLEANUP_SYNC"
