set -g status-style "bg=#ebdbb2,fg=#282828"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#076678"
set -g status-left-length 60
set -g status-right-length 60

# -- Session name --
set -g status-left "#[fg=#8f3f71,bold]  #S #[fg=#504945,nobold] / "

# -- Window list --
set -g window-status-separator " / "
set -g window-status-format "#[fg=#504945] #I. 󰉋 #{b:pane_current_path}#[fg=#a63703]#{?#{!=:#(cd #{pane_current_path} 2>/dev/null && git branch --show-current 2>/dev/null),}, ( #(cd #{pane_current_path} 2>/dev/null && git branch --show-current 2>/dev/null)),}"
set -g window-status-current-format "#[fg=#076678,bold] #I. 󰉋 #{b:pane_current_path}#[fg=#a63703]#{?#{!=:#(cd #{pane_current_path} 2>/dev/null && git branch --show-current 2>/dev/null),}, ( #(cd #{pane_current_path} 2>/dev/null && git branch --show-current 2>/dev/null)),}#[fg=#076678,nobold]"
