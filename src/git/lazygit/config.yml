gui:
  scrollPastBottom: true
  mouseEvents: true
  sidePanelWidth: 0.2
  expandFocusedSidePanel: true
  
  theme:
    activeBorderColor:
      - "#3e8fb0"
      - bold
    inactiveBorderColor:
      - "#6e6a86"
    searchingActiveBorderColor:
      - "#ea9a97"
      - bold
    optionsTextColor:
      - "#9ccfd8"
    selectedLineBgColor:
      - "#3e8fb0"
    inactiveViewSelectedLineBgColor:
      - "#393552"
      - bold
    cherryPickedCommitFgColor:
      - "#2a273f"
    cherryPickedCommitBgColor:
      - "#ea9a97"
    markedBaseCommitFgColor:
      - "#9ccfd8"
    markedBaseCommitBgColor:
      - "#f6c177"
    unstagedChangesColor:
      - "#eb6f92"
    defaultFgColor:
      - "#e0def4"
  
  showNumstatInFilesView: true
  showRandomTip: false
  nerdFontsVersion: "3"
  showDivergenceFromBaseBranch: "arrowAndNumber"
  filterMode: fuzzy
  spinner:
    rate: 16

git:
  localBranchSortOrder: recency
  pagers:
    - colorArg: always
      pager: "delta --side-by-side --paging=never"
      externalDiffTool: "delta --side-by-side --paging=never"
  parseEmoji: true

os:
  editPreset: nvim

notARepository: quit
quitOnTopLevelReturn: true
keybinding:
  universal:
    return: <c-q>

customCommands:
  - key: "W"
    context: "localBranches"
    command: "~/.config/lazygit/create-worktree.sh existing {{.SelectedLocalBranch.Name | quote}}"
    description: "Create sibling worktree"
    loadingText: "Creating worktree..."
  - key: "N"
    context: "localBranches"
    prompts:
      - type: "input"
        title: "New branch name"
        key: "BranchName"
    command: "~/.config/lazygit/create-worktree.sh new {{.Form.BranchName | quote}} {{.SelectedLocalBranch.Name | quote}}"
    description: "Create branch and sibling worktree"
    loadingText: "Creating branch and worktree..."
  - key: "D"
    context: "localBranches"
    prompts:
      - type: "confirm"
        title: "Remove worktree and branch"
        body: "Remove {{.SelectedLocalBranch.Name}}? Uncommitted, untracked, and ignored files in its worktree will be deleted."
    command: "LAZYGIT_CLEANUP_CONFIRMED=1 ~/.config/lazygit/cleanup-worktree.sh {{.SelectedLocalBranch.Name | quote}}"
    description: "Remove worktree and local branch"
    loadingText: "Removing worktree and branch..."
  - key: "W"
    context: "remoteBranches"
    command: "~/.config/lazygit/create-worktree.sh remote {{.SelectedRemoteBranch.RemoteName | quote}} {{.SelectedRemoteBranch.Name | quote}} && ~/.config/lazygit/focus-local-branches.sh"
    description: "Pull as worktree"
    loadingText: "Pulling branch into worktree..."
