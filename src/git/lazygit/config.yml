gui:
  scrollPastBottom: true
  mouseEvents: true
  sidePanelWidth: 0.2
  expandFocusedSidePanel: true
  
  theme:
    activeBorderColor:
      - "#3e8fb0"
      - bold
    inactiveBorderColor:
      - "#6e6a86"
    searchingActiveBorderColor:
      - "#ea9a97"
      - bold
    optionsTextColor:
      - "#9ccfd8"
    selectedLineBgColor:
      - "#3e8fb0"
    inactiveViewSelectedLineBgColor:
      - "#393552"
      - bold
    cherryPickedCommitFgColor:
      - "#2a273f"
    cherryPickedCommitBgColor:
      - "#ea9a97"
    markedBaseCommitFgColor:
      - "#9ccfd8"
    markedBaseCommitBgColor:
      - "#f6c177"
    unstagedChangesColor:
      - "#eb6f92"
    defaultFgColor:
      - "#e0def4"
  
  showNumstatInFilesView: true
  showRandomTip: false
  nerdFontsVersion: "3"
  showDivergenceFromBaseBranch: "arrowAndNumber"
  filterMode: fuzzy
  spinner:
    rate: 60

git:
  localBranchSortOrder: recency
  pagers:
    - colorArg: always
      pager: "delta --side-by-side --paging=never"
      externalDiffTool: "delta --side-by-side --paging=never"
  parseEmoji: true

os:
  editPreset: nvim

notARepository: quit
quitOnTopLevelReturn: true
keybinding:
  universal:
    return: <c-q>

customCommands:
  - key: "N"
    context: "localBranches"
    description: "New worktree + branch (sibling dir: {repo}_{name})"
    prompts:
      - type: "input"
        title: "New branch / worktree name"
        key: "Name"
    command: >-
      bash -c '
      set -e;
      name="{{.Form.Name}}";
      repo_root="$(git rev-parse --show-toplevel)";
      repo_dir="$(basename "$repo_root")";
      parent="$(dirname "$repo_root")";
      safe_name="${name//\//-}";
      git worktree add -b "$name" "$parent/${repo_dir}_${safe_name}"
      '
    loadingText: "Creating worktree..."
  - key: "D"
    context: "worktrees"
    description: "Force remove worktree"
    command: "git worktree remove --force {{.SelectedWorktree.Path}}"
    prompts:
      - type: "confirm"
        title: "Force remove worktree"
        body: "Discard any uncommitted changes in {{.SelectedWorktree.Path}} and remove it?"
